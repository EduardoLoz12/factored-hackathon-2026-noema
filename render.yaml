services:
  - type: web
    name: noema-api
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install -e .
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: NOEMA_CORS_ORIGINS
        sync: false
      - key: NOEMA_ANALYTICS_DB
        value: data/noema.duckdb
      - key: NOEMA_LEDGER_DB
        value: data/noema_ledger.duckdb
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
