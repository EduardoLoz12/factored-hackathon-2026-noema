[project]
name = "noema-bank-agent"
version = "0.1.0"
description = "Sistema de servicio al cliente bancario — elegibilidad de productos de crédito. Factored AI & Data Hackathon 2026."
requires-python = ">=3.11"
dependencies = [
    # datos
    "boto3>=1.34",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "pandera>=0.20",
    # ml
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "mlflow>=2.16",
    "shap>=0.46",
    # agente y api
    "anthropic>=0.39",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyjwt>=2.9",
    "structlog>=24.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert permitido en tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
